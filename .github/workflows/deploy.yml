name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild weekly so the contributor list from the GitHub API stays current.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gives the Pages URL: /SHOT-website as base path on github.io, empty once a custom domain is set.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      # Keep docs source beside solver code; the website owns the combined deployment.
      - uses: actions/checkout@v4
        with:
          repository: coin-or/SHOT
          ref: master
          path: shot-source
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation build dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen coinor-libipopt-dev libopenblas-dev ninja-build
      - name: Install documentation tools
        run: python -m pip install -r shot-source/docs/requirements.txt
      - name: Compile and install matching SHOTpy
        timeout-minutes: 45
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        # Stream compiler progress so the native build does not appear stalled.
        run: python -m pip install --verbose ./shot-source --config-settings=cmake.define.HAS_CBC=off
      - name: Build development documentation
        run: python shot-source/docs/build.py --source-ref "$(git -C shot-source rev-parse HEAD)" --output dist/docs/dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
